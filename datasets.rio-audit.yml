backup_subjects:
  - id: prestashop
    domain: ecommerce
    repo_url: https://github.com/PrestaShop/PrestaShop.git
    rio_version_range: "1.5.0.0-1.7.6.1"
    reason: Heavy restoration, but strong subject if one primary fails.

  - id: vanilla
    domain: forum
    repo_url: https://github.com/vanilla/vanilla.git
    rio_version_range: "2.0-3.3"
    reason: Useful forum backup; OSS version availability must be checked.

  - id: mediawiki
    domain: wiki
    repo_url: https://github.com/wikimedia/mediawiki.git
    rio_version_range: "1.1.0-1.33.1"
