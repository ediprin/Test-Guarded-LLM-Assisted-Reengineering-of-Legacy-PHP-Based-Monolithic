# Primary audit input for the reproducible PHP reengineering experiment.
# These subjects follow the PHP web-application sample reported by Rio et al.
# Do not run transformation treatments until install_status, test_status, and
# oracle_status are known and stable.

source_basis:
  paper_pdf: s10664-024-10478-0.pdf
  replication_package:
    github: https://github.com/studywebcs/data
    zenodo: https://zenodo.org/doi/10.5281/zenodo.10838018
  note: >
    The replication package provides release-level smell, metric, issue, and bug data.
    This experiment must construct a new candidate-level transformation dataset from
    restored subject systems.

selection_rules:
  include:
    - open-source PHP web application
    - PHP as server-side language
    - self-contained application
    - server-side and client-side code in the same codebase
    - object-oriented PHP present in selected release
  exclude:
    - library-only project
    - framework or framework-builder project
    - framework-based application where framework code dominates the subject
    - release that cannot be restored in a controlled environment
    - candidate without stable pre-transformation oracle

